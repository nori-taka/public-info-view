<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>群馬 公共情報</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1d2733; --sub: #657283; --line: #e1e5ea; --accent: #1f6feb;
    --news: #2b7a4b; --bid: #b4540a; --doc: #5a47b8; --hit: #fff1c2; --hit-ink: #6b4b00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161b; --card: #1b2128; --ink: #e8edf2; --sub: #93a1b1; --line: #2c3540; --accent: #5a9bff;
      --news: #5fc58a; --bid: #f0a05a; --doc: #a99bff; --hit: #4a3b0c; --hit-ink: #ffe9a8;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { display: flex; gap: 8px; align-items: center; padding: 10px 16px; flex-wrap: wrap; max-width: 960px; margin: 0 auto; }
  h1 { font-size: 16px; margin: 0 8px 0 0; white-space: nowrap; }
  #q { flex: 1 1 220px; min-width: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
  button, select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 0 16px 10px; max-width: 960px; margin: 0 auto; }
  .tabs button { border-radius: 999px; }
  .tabs button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  label.chk { color: var(--sub); display: inline-flex; gap: 4px; align-items: center; }
  main { max-width: 960px; margin: 0 auto; padding: 8px 16px 60px; }
  .day { margin: 18px 0 6px; font-weight: 600; color: var(--sub); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
  .card:hover { border-color: var(--accent); }
  .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--sub); }
  .badge { font-weight: 600; padding: 0 8px; border-radius: 999px; border: 1px solid currentColor; }
  .badge.news { color: var(--news); } .badge.bid { color: var(--bid); } .badge.doc { color: var(--doc); }
  .title { margin: 2px 0; font-weight: 600; word-break: break-word; }
  .snip { color: var(--sub); font-size: 13px; word-break: break-word; }
  mark { background: var(--hit); color: var(--hit-ink); border-radius: 3px; padding: 0 1px; }
  .chip { background: var(--hit); color: var(--hit-ink); padding: 0 6px; border-radius: 4px; font-size: 11px; }
  .empty, .err { color: var(--sub); text-align: center; padding: 40px 0; }
  .err { color: #c0392b; }
  #login { max-width: 420px; margin: 20vh auto; padding: 0 16px; }
  #login input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); font: inherit; }
  .hidden { display: none !important; }
  #drawer { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; }
  #panel { position: absolute; right: 0; top: 0; bottom: 0; width: min(720px, 100%); background: var(--card); overflow: auto; padding: 16px; }
  #panel h2 { font-size: 17px; margin: 6px 0 10px; word-break: break-word; }
  #panel .cells { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  #panel .cells td { border-top: 1px solid var(--line); padding: 4px 6px; vertical-align: top; word-break: break-word; }
  #panel pre { white-space: pre-wrap; word-break: break-word; font: 13px/1.7 inherit; background: var(--bg); padding: 10px; border-radius: 8px; max-height: 60vh; overflow: auto; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  a { color: var(--accent); }
  .banner { background: var(--hit); color: var(--hit-ink); padding: 6px 16px; text-align: center; font-size: 13px; }
</style>
</head>
<body>
<div id="login" class="hidden">
  <h1>群馬 公共情報</h1>
  <p class="snip">登録済みのメールアドレスに、ログイン用のリンクを送ります。</p>
  <input id="email" type="email" placeholder="メールアドレス" autocomplete="email">
  <button class="primary" id="sendLink">ログインリンクを送る</button>
  <p id="loginMsg" class="snip"></p>
</div>

<div id="app" class="hidden">
  <header>
    <div id="demoBanner" class="banner hidden">試運転版（ログインなし・この端末の demo-data.json を表示中）</div>
    <div class="bar">
      <h1>群馬 公共情報</h1>
      <input id="q" type="search" placeholder="資料の中身を検索（例: 最低制限価格 / 総合計画 / 橋梁）">
      <button id="reload" title="再読み込み">更新</button>
      <button id="logout" class="hidden">ログアウト</button>
    </div>
    <div class="filters">
      <span class="tabs" id="tabs"></span>
      <select id="org"></select>
      <select id="days">
        <option value="3">直近3日</option><option value="7" selected>直近7日</option>
        <option value="30">直近30日</option><option value="0">すべて</option>
      </select>
      <label class="chk"><input type="checkbox" id="notable">注目のみ</label>
    </div>
  </header>
  <main id="list"></main>
</div>

<div id="drawer" class="hidden"><div id="panel"></div></div>

<script src="config.js"></script>
<script src="store.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const KINDS = [["", "すべて"], ["news", "新着"], ["bid", "入札"], ["doc", "議会資料"]];
const KIND_NAME = { news: "新着", bid: "入札", doc: "議会資料" };
const ORGS = [["ota","太田市","0205"],["kiryu","桐生市","0203"],["tatebayashi","館林市","0207"],["midori","みどり市","0212"],
  ["itakura","板倉町","0521"],["meiwa","明和町","0522"],["chiyoda","千代田町","0523"],["oizumi","大泉町","0524"],
  ["ora","邑楽町","0525"],["gtsk","群馬東部水道企業団","9193"],["watarase","渡良瀬川河川事務所",""],["gunma","群馬県","0010"]];
const BID_HEAD = ["工事名・件名","入札方式","場所","公開日","予定価格","発注元","案件番号","工種","開札日"];
const state = { kind: "", q: "" };

function hl(text, q) {   // 検索語を目立たせる
  const t = esc(text);
  if (!q) return t;
  const re = new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  return t.replace(re, (m) => `<mark>${m}</mark>`);
}
const dayKey = (iso) => new Date(iso).toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric", weekday: "short" });
const timeOf = (iso) => new Date(iso).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });

function card(r, q) {
  const hits = (r.hits || []).slice(0, 5).map((h) => `<span class="chip">${esc(h)}</span>`).join(" ");
  const snip = r.snippet ? `<div class="snip">${hl(r.snippet, q)}</div>` : "";
  return `<div class="card" data-id="${esc(r.id)}">
    <div class="meta"><span class="badge ${r.kind}">${KIND_NAME[r.kind]}</span><span>${esc(r.org)}</span><span>${esc(r.label)}</span>
      <span>${timeOf(r.first_seen)}</span>${hits}</div>
    <div class="title">${hl(r.title, q)}</div>${snip}</div>`;
}

async function render() {
  const el = $("#list");
  el.innerHTML = '<div class="empty">読み込み中…</div>';
  const o = { kind: state.kind, org: $("#org").value, days: +$("#days").value, notable: $("#notable").checked };
  try {
    let rows;
    if (state.q) rows = await store.search(state.q, o);
    else rows = await store.list(o);
    if (!rows.length) { el.innerHTML = `<div class="empty">${state.q ? "一致するものがありません" : "この条件の新着はありません"}</div>`; return; }
    let html = state.q ? `<div class="day">「${esc(state.q)}」の検索結果 ${rows.length}件${rows.length >= 80 ? "（上位80件）" : ""}</div>` : "", last = "";
    for (const r of rows) {
      const k = dayKey(r.first_seen);
      if (!state.q && k !== last) { html += `<div class="day">${k}</div>`; last = k; }
      html += card(r, state.q);
    }
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = `<div class="err">読み込めませんでした: ${esc(e.message || e)}</div>`;
  }
}

async function openDetail(id) {
  const r = await store.detail(id);
  if (!r) return;
  const org = ORGS.find((x) => x[0] === r.org_id);
  let body = "";
  if (r.kind === "bid") {
    const cells = (r.meta && r.meta.cells) || [];
    body += `<table class="cells">${cells.map((c, i) => `<tr><td>${BID_HEAD[i] && cells.length >= 8 ? BID_HEAD[i] : ""}</td><td>${esc(c)}</td></tr>`).join("")}</table>`;
    if (org && org[2]) body += `<div class="row"><a href="https://portal.g-cals.e-gunma.lg.jp/ebia/servlet/p?job=AcDantaiZTop&kikan_no=${org[2]}" target="_blank" rel="noopener">電子入札システムで${esc(r.org)}の案件を開く</a></div>`;
    body += `<p class="snip">設計書・最低制限価格などの中身は、ゾフィーに「この案件を深掘りして」と頼むと取り込んで要約します。</p>`;
  } else {
    if (r.url) body += `<div class="row"><a href="${esc(r.url)}" target="_blank" rel="noopener">原文を開く</a></div>`;
    body += `<pre>${hl((r.body || "（本文なし）").slice(0, 60000), state.q)}</pre>`;
    if ((r.body || "").length > 60000) body += `<p class="snip">本文が長いため先頭6万字までを表示しています。全文は原文で。</p>`;
  }
  const hits = (r.hits || []).map((h) => `<span class="chip">${esc(h)}</span>`).join(" ");
  $("#panel").innerHTML = `<div class="row"><button id="close">閉じる</button></div>
    <div class="meta"><span class="badge ${r.kind}">${KIND_NAME[r.kind]}</span><span>${esc(r.org)}</span><span>${esc(r.label)}</span>
    <span>${new Date(r.first_seen).toLocaleString("ja-JP")}</span>${hits}</div><h2>${esc(r.title)}</h2>${body}`;
  $("#drawer").classList.remove("hidden");
  $("#close").onclick = closeDetail;
  $("#panel").scrollTop = 0;
}
const closeDetail = () => $("#drawer").classList.add("hidden");

function setup() {
  $("#tabs").innerHTML = KINDS.map(([k, n]) => `<button data-k="${k}" class="${k === state.kind ? "on" : ""}">${n}</button>`).join("");
  $("#org").innerHTML = '<option value="">全団体</option>' + ORGS.map(([id, n]) => `<option value="${id}">${n}</option>`).join("");
  $("#tabs").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; state.kind = b.dataset.k;
    document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x === b)); render(); };
  ["#org", "#days", "#notable"].forEach((s) => ($(s).onchange = render));
  let t; $("#q").oninput = (e) => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value.trim(); render(); }, 350); };
  $("#reload").onclick = render;
  $("#list").onclick = (e) => { const c = e.target.closest(".card"); if (c) openDetail(c.dataset.id); };
  $("#drawer").onclick = (e) => { if (e.target.id === "drawer") closeDetail(); };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDetail(); });
}

(async function main() {
  let st;
  try { st = await store.init(); }
  catch (e) { document.body.innerHTML = `<div class="err">起動できませんでした: ${esc(e.message || e)}</div>`; return; }
  if (st.needLogin) {
    $("#login").classList.remove("hidden");
    $("#sendLink").onclick = async () => {
      const email = $("#email").value.trim(); if (!email) return;
      try { await store.sendLoginLink(email); $("#loginMsg").textContent = "送りました。メールのリンクを、このブラウザで開いてください。"; }
      catch (e) { $("#loginMsg").textContent = "送れませんでした: " + (e.message || e); }
    };
    return;
  }
  $("#app").classList.remove("hidden");
  if (store.mode === "demo") $("#demoBanner").classList.remove("hidden");
  else { $("#logout").classList.remove("hidden"); $("#logout").onclick = () => store.logout(); }
  setup(); render();
})();
</script>
</body>
</html>
